<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OppimisKeskus 3.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4fb;color:#26334b;font-family:Arial,sans-serif}
header{padding:23px 5%;background:linear-gradient(120deg,#385be0,#8755d9);color:white}header h1{margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap;background:white;padding:13px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #0001}
button{border:0;border-radius:10px;background:#5369e8;color:white;padding:11px 15px;font-weight:bold;cursor:pointer;margin:3px}button:hover{filter:brightness(.9)}nav button{background:#edf0ff;color:#354a9b}
main{max-width:1100px;margin:24px auto;padding:0 15px}.card{background:white;padding:20px;border-radius:17px;margin:14px 0;box-shadow:0 4px 18px #00000009}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9dfeb;border-radius:10px;margin:7px 0 12px;font:inherit}textarea{min-height:90px}label{font-weight:bold}.hidden{display:none!important}.muted{color:#7b8495}.bad{color:#c0392b;font-weight:bold}.good{color:green;font-weight:bold}
.item{border:1px solid #e4e8f1;padding:15px;border-radius:13px;margin:12px 0}.hero{background:linear-gradient(120deg,#e5ebff,#f2eaff);padding:27px;border-radius:18px}.big{font-size:30px;font-weight:bold;color:#5268df}.login{max-width:450px;margin:40px auto;padding:15px}footer{text-align:center;padding:25px;color:#888}hr{border:0;border-top:1px solid #e5e8f0;margin:20px 0}
.feed-post{background:#fff;border:1px solid #e4e8f1;border-radius:14px;padding:17px;margin:14px 0}.feed-head{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#5865f2;color:white;display:grid;place-items:center;font-weight:bold}.feed-post .post-content{white-space:pre-wrap;overflow-wrap:anywhere}.emoji-row button{background:#f0f2ff;color:#334}.note-area{min-height:220px}.role-tag{display:inline-block;background:#eef0ff;color:#4c5fca;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:bold}
@media print{header,nav,button,footer,.no-print{display:none!important}body{background:white}.card{box-shadow:none}}
</style></head><body>
<header><h1>📚 OppimisKeskus</h1><p>Opiskele · Harjoittele · Onnistu 🇫🇮</p></header>
<div id="login" class="login"><div class="card"><h2>👋 Tervetuloa!</h2>
<label>Käyttäjärooli</label><select id="role"><option value="student">Oppilas</option><option value="teacher">Opettaja</option><option value="admin">Admin</option></select>
<label>Oma nimi / käyttäjätunnus</label><input id="name" placeholder="Kirjoita nimesi">
<label>Valitse luokka</label><select id="grade"></select>
<label>Salasana</label><input id="password" type="password" placeholder="Salasana">
<p class="muted">Ensimmäisellä kirjautumisella luodaan paikallinen käyttäjätili. Valitse oma salasana, jota voit käyttää myöhemmin.</p>
<button style="width:100%" onclick="login()">Kirjaudu sisään / luo tili</button><p id="error" class="bad"></p></div></div>
<div id="site" class="hidden"><nav id="nav"></nav><main id="main"></main></div><footer>OppimisKeskus 3.3 · Suomen kouluympäristö</footer>
<script>
'use strict';
const STUDENT_PASS='649446',TEACHER_PASS='9923345',ADMIN_PASS='33345644';
const DB='oppimiskeskus_3_database',ACCOUNTS='oppimiskeskus_accounts',NOTES='oppimiskeskus_teacher_notes',BANS='oppimiskeskus_bans',ROLES='oppimiskeskus_roles',PERMS='oppimiskeskus_permissions';
const GRADES=['7A','7B','7G','8A','8B','8G','9A','9B','9G'];
const SUBJECTS=['Matematiikka','Äidinkieli','Englanti','Ruotsi','Historia','Yhteiskuntaoppi','Biologia','Maantieto','Fysiikka','Kemia','Terveystieto','Uskonto','Muu'];
const DEFAULT_PERMS={adminUpdates:true,manageAccounts:true,resetContent:true,manageRoles:true,teacherNotes:true,createQuizzes:true,createWorksheets:true,postAnnouncements:true};
let role='',username='',myGrade='',page='home',gameAnswer=0,points=0,answered=0,gameType='mix',difficulty='medium',currentQuestion=null,blocks=[];
const $=id=>document.getElementById(id);
function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function writeStore(key,value){localStorage.setItem(key,JSON.stringify(value))}
function fresh(){return {posts:[],quizzes:[],worksheets:[],comments:[],punishments:[],updates:[]}}
function getData(){let d=readStore(DB,fresh());return {...fresh(),...d}}
function save(d){writeStore(DB,d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function gradeOptions(selected='ALL'){return `<option value="ALL" ${selected==='ALL'?'selected':''}>Kaikki luokat</option>`+GRADES.map(g=>`<option value="${g}" ${g===selected?'selected':''}>${g}</option>`).join('')}
function subjectOptions(){return SUBJECTS.map(s=>`<option>${esc(s)}</option>`).join('')}
function accounts(){return readStore(ACCOUNTS,[])}function saveAccounts(a){writeStore(ACCOUNTS,a)}function banned(){return readStore(BANS,[])}function isBanned(n){return banned().some(x=>x.toLowerCase()===n.toLowerCase())}
function getPerms(){return {...DEFAULT_PERMS,...readStore(PERMS,{})}}
function can(p){return role==='admin'||!!getPerms()[p]}
function login(){
 const r=$('role').value,n=$('name').value.trim(),p=$('password').value,g=$('grade').value;
 if(!n){$('error').textContent='Kirjoita käyttäjätunnus tai nimi.';return}
 if(!g){$('error').textContent='Valitse luokka.';return}
 if(isBanned(n)){$('error').textContent='Tämä käyttäjä on estetty tällä laitteella.';return}
 if(r==='admin'){
   if(p!==ADMIN_PASS){$('error').textContent='Väärä admin-salasana.';return}
   role='admin';username=n;myGrade=g;
 } else {
   const legacy=r==='student'?STUDENT_PASS:TEACHER_PASS;
   let list=accounts(),existing=list.find(a=>a.name.toLowerCase()===n.toLowerCase()&&a.role===r);
   if(existing){if(existing.password!==p){$('error').textContent='Väärä salasana. Käytä tilisi omaa salasanaa.';return} }
   else if(p===legacy){list.push({name:n,role:r,grade:g,password:p,created:new Date().toISOString()});saveAccounts(list)}
   else if(p.length>=4){list.push({name:n,role:r,grade:g,password:p,created:new Date().toISOString()});saveAccounts(list)}
   else {$('error').textContent='Tilin luontiin tarvitaan vähintään 4 merkin salasana. (Vanha roolipassikin toimii.)';return}
   role=r;username=n;myGrade=existing?.grade||g;
 }
 page='home';$('login').classList.add('hidden');$('site').classList.remove('hidden');render();
}
$('grade').innerHTML=GRADES.map(g=>`<option value="${g}">${g}</option>`).join('');$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function logout(){role='';username='';myGrade='';$('site').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';$('name').value='';$('error').textContent=''}
function visible(item){return item.audience==='ALL'||item.audience===myGrade}
function audienceControl(id='audience'){return `<label>Kenelle julkaistaan?</label><select id="${id}">${gradeOptions('ALL')}</select><p class="muted">Valitse Kaikki luokat tai yksi tietty luokka.</p>`}
function render(){const pages=[['home','🏠 Etusivu'],['news','📢 Ilmoitukset'],['updates','🆕 Päivitykset'],['quizzes','📝 Kokeet'],['games','🎮 Matematiikka'],['worksheets','📄 Tehtäväpaperit'],['classroom','🖥️ Classroom Screen'],...(role==='student'?[['myMarks','🔔 Omat merkinnät']]:[])];
 $('nav').innerHTML=pages.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')+(role==='teacher'||role==='admin'?`<button onclick="go('tools')">🛠️ Opettaja</button><button onclick="go('notes')">📒 Muistiinpanot</button>`:'')+(role==='admin'?`<button onclick="go('admin')">🛡️ Admin</button>`:'')+(role==='teacher'||role==='admin'?`<button onclick="go('discipline')">📋 Merkinnät</button><button onclick="go('classroom')">🖥️ Classroom Screen</button>`:'<button onclick="go(\'classroom\')">🖥️ Classroom Screen</button>')+(role==='student'?`<button onclick="go('myMarks')">🔔 Omat merkinnät</button>`:'')+`<button onclick="logout()">🚪 Ulos</button>`;
 const m=$('main');if(page==='home')home(m);if(page==='news')news(m);if(page==='updates')updates(m);if(page==='quizzes')quizzes(m);if(page==='games')games(m);if(page==='worksheets')worksheets(m);if(page==='tools'&&(role==='teacher'||role==='admin'))tools(m);if(page==='notes'&&(role==='teacher'||role==='admin'))notes(m);if(page==='admin'&&role==='admin')adminPage(m);if(page==='discipline'&&(role==='teacher'||role==='admin'))discipline(m);if(page==='classroom')classroom(m);if(page==='myMarks'&&role==='student')myMarks(m)}
function go(p){page=p;render()}
function home(m){let studentMarks=role==='student'?getData().punishments.filter(p=>(p.name||'').trim().toLowerCase()===username.trim().toLowerCase()&&!p.seen):[];m.innerHTML=`${studentMarks.length?`<div class="card"><h3>🔔 Sinulle on uusi merkintä</h3><p>Opettaja on lisännyt sinulle merkinnän. Näet sen omalta merkinnät-sivulta.</p><button onclick="go('myMarks')">Katso merkintä</button></div>`:''}<div class="hero"><h2>Hei ${esc(username)}! 👋</h2><p>Rooli: ${role==='admin'?'Admin':role==='teacher'?'Opettaja':'Oppilas'} · Luokka: ${esc(myGrade)}</p><h3>Tervetuloa OppimisKeskukseen!</h3></div><div class="grid"><div class="card"><h3>📢 Ilmoitukset</h3><button onclick="go('news')">Avaa</button></div><div class="card"><h3>🆕 Päivitykset</h3><button onclick="go('updates')">Avaa</button></div><div class="card"><h3>📝 Kokeet</h3><button onclick="go('quizzes')">Avaa</button></div><div class="card"><h3>🎮 Matematiikka</h3><button onclick="go('games')">Pelaa</button></div><div class="card"><h3>📄 Tehtäväpaperit</h3><button onclick="go('worksheets')">Avaa</button></div><div class="card"><h3>🖥️ Classroom Screen</h3><button onclick="go('classroom')">Avaa</button></div>${role==='student'?`<div class="card"><h3>🔔 Omat merkinnät</h3><button onclick="go('myMarks')">Avaa</button></div>`:''}${role!=='student'?`<div class="card"><h3>📒 Muistiinpanot</h3><button onclick="go('notes')">Avaa</button></div>`:''}${role==='admin'?`<div class="card"><h3>🛡️ Admin</h3><button onclick="go('admin')">Avaa hallinta</button></div>`:''}</div><h3>📌 Sinun luokkasi: ${esc(myGrade)}</h3>`}
/* Announcements with basic emoji picker */
const emojis=['😀','😎','🎉','📚','📢','📝','🔥','⭐','❤️','👍','😂','🤔','💡','🏆','🎮','🇫🇮','✅','⚠️','✨','👏'];
function emojiButtons(target){return `<div class="emoji-row">${emojis.map(e=>`<button type="button" onclick="insertEmoji('${target}','${e}')">${e}</button>`).join('')}</div>`}
function insertEmoji(id,e){let el=$(id);if(!el)return;let start=el.selectionStart??el.value.length,end=el.selectionEnd??el.value.length;el.value=el.value.slice(0,start)+e+el.value.slice(end);el.focus();el.selectionStart=el.selectionEnd=start+e.length}
function news(m){let d=getData(),posts=d.posts.filter(visible);m.innerHTML=`<h2>📢 Ilmoitukset</h2>${role!=='student'?`<div class="card"><h3>Uusi ilmoitus</h3><input id="postTitle" placeholder="Otsikko"><textarea id="postBody" placeholder="Ilmoituksen teksti"></textarea>${emojiButtons('postBody')}${audienceControl('postAudience')}<button onclick="addPost()">Julkaise ilmoitus</button></div>`:''}${posts.slice().reverse().map(p=>{let i=d.posts.indexOf(p),liked=(p.likedBy||[]).includes(username);return `<div class="card"><h3>${esc(p.title)}</h3><p class="post-content">${esc(p.body)}</p><small>${esc(p.author)} · ${esc(p.grade)} · ${p.audience==='ALL'?'Kaikki luokat':esc(p.audience)}</small><p><button onclick="toggleLike(${i})">${liked?'❤️ Tykkäsit':'🤍 Tykkää'} (${(p.likedBy||[]).length})</button></p><h4>Kommentit</h4>${(p.comments||[]).filter(visible).map(c=>`<div class="item"><b>${esc(c.author)}</b>: ${esc(c.text)}</div>`).join('')}<input id="comment${i}" placeholder="Kirjoita kommentti">${audienceControl('commentAudience'+i)}<button onclick="addComment(${i})">Lähetä kommentti</button>${role==='admin'?`<button onclick="removePost(${i})">Poista</button>`:''}</div>`}).join('')||`<div class="card">Ei ilmoituksia tälle luokalle.</div>`}`}
function addPost(){let title=$('postTitle').value.trim(),body=$('postBody').value.trim();if(!title||!body)return alert('Täytä otsikko ja teksti.');let d=getData();d.posts.push({title,body,author:username,grade:myGrade,audience:$('postAudience').value,likedBy:[],comments:[]});save(d);render()}
function toggleLike(i){let d=getData(),p=d.posts[i];p.likedBy=p.likedBy||[];let at=p.likedBy.indexOf(username);if(at>=0)p.likedBy.splice(at,1);else p.likedBy.push(username);save(d);render()}
const badWords=['vittu','perkele','saatana','paska','kusipää','idiootti','helvetti'];function filterText(text){let flagged=false;badWords.forEach(w=>{let re=new RegExp(w,'gi');if(re.test(text)){flagged=true;text=text.replace(re,'#'.repeat(w.length))}});return {text,flagged}}
function addComment(i){let text=$('comment'+i).value.trim();if(!text)return;let filtered=filterText(text),d=getData();d.posts[i].comments.push({author:username,text:filtered.text,flagged:filtered.flagged,audience:$('commentAudience'+i).value});save(d);render();if(filtered.flagged)alert('Sopimatonta kieltä havaittu. Sanat on suodatettu.')}
function removePost(i){if(!confirm('Poistetaanko ilmoitus?'))return;let d=getData();d.posts.splice(i,1);save(d);render()}
/* Admin-only Discord-like updates feed */
function updates(m){let d=getData(),arr=d.updates||[];m.innerHTML=`<h2>🆕 Päivitykset <span class="muted"># ilmoitukset</span></h2>${role==='admin'?`<div class="card"><h3>Julkaise palvelun päivitys</h3><input id="updateTitle" placeholder="Päivityksen otsikko"><textarea id="updateText" placeholder="Kirjoita päivityksen sisältö..."></textarea>${emojiButtons('updateText')}<button onclick="addUpdate()">Julkaise päivitys</button></div>`:''}${arr.slice().reverse().map((u,i)=>`<div class="feed-post"><div class="feed-head"><div class="avatar">${esc((u.author||'A').slice(0,1).toUpperCase())}</div><div><b>${esc(u.author)}</b> <span class="role-tag">ADMIN</span><div class="muted">#updates · ${esc(u.date)}</div></div></div><h3>${esc(u.title)}</h3><p class="post-content">${esc(u.text)}</p>${role==='admin'?`<button onclick="deleteUpdate(${arr.length-1-i})">Poista päivitys</button>`:''}</div>`).join('')||`<div class="card">Ei vielä päivityksiä.</div>`}`}
function addUpdate(){if(role!=='admin')return;let title=$('updateTitle').value.trim(),text=$('updateText').value.trim();if(!title||!text)return alert('Täytä otsikko ja sisältö.');let d=getData();d.updates=d.updates||[];d.updates.push({title,text,author:username,date:new Date().toLocaleString('fi-FI')});save(d);render()}
function deleteUpdate(i){if(role!=='admin'||!confirm('Poistetaanko päivitys?'))return;let d=getData();d.updates.splice(i,1);save(d);render()}
/* Teacher's autosaving notebook */
function notes(m){let key=NOTES+'_'+username,panels=readStore(key,[]);if(!Array.isArray(panels))panels=[{name:'Muistiinpano',html:String(panels||'')}];if(!panels.length)panels=[{name:'Muistiinpano 1',html:''}];let active=readStore(key+'_active',0);active=Math.max(0,Math.min(active,panels.length-1));m.innerHTML=`<h2>📒 Opettajan muistivihko</h2><div class="card"><p class="muted">Useita muistipaneeleita. Tallennus tapahtuu automaattisesti. Voit liittää kuvan leikepöydältä (Ctrl+V) tekstialueeseen.</p><div class="item">${panels.map((p,i)=>`<button onclick="switchNotePanel(${i})" style="background:${i===active?'#5369e8':'#edf0ff'};color:${i===active?'white':'#354a9b'}">${esc(p.name||'Nimetön paneeli')}</button>`).join('')}<button onclick="addNotePanel()">＋ Uusi paneeli</button><button onclick="renameNotePanel(${active})">✏️ Nimeä</button><button onclick="deleteNotePanel(${active})">🗑️ Poista</button></div><label>${esc(panels[active].name)}</label><div id="noteEditor" contenteditable="true" style="min-height:260px;border:1px solid #d9dfeb;border-radius:10px;padding:12px;background:white;overflow:auto">${panels[active].html||''}</div><p id="noteStatus" class="muted">Tallennettu tähän selaimeen.</p></div>`;let editor=$('noteEditor');editor.addEventListener('input',()=>{panels[active].html=editor.innerHTML;writeStore(key,panels);$('noteStatus').textContent='Tallennettu ✓'});editor.addEventListener('paste',e=>{let items=e.clipboardData?.items||[];for(let it of items){if(it.type.startsWith('image/')){let file=it.getAsFile();if(file){e.preventDefault();let reader=new FileReader();reader.onload=()=>{document.execCommand('insertImage',false,reader.result);panels[active].html=editor.innerHTML;writeStore(key,panels)};reader.readAsDataURL(file)}}}})}
function switchNotePanel(i){writeStore(NOTES+'_'+username+'_active',i);render()}
function addNotePanel(){let panels=readStore(NOTES+'_'+username,[]);if(!Array.isArray(panels))panels=[{name:'Muistiinpano',html:String(panels||'')}];panels.push({name:'Muistivihko '+(panels.length+1),html:''});writeStore(NOTES+'_'+username,panels);writeStore(NOTES+'_'+username+'_active',panels.length-1);render()}
function renameNotePanel(i){let panels=readStore(NOTES+'_'+username,[]),name=prompt('Paneelin uusi nimi:',panels[i]?.name||'');if(name&&name.trim()){panels[i].name=name.trim();writeStore(NOTES+'_'+username,panels);render()}}
function deleteNotePanel(i){let panels=readStore(NOTES+'_'+username,[]);if(panels.length<2)return alert('Viimeistä paneelia ei voi poistaa.');if(!confirm('Poistetaanko tämä muistipaneeli?'))return;panels.splice(i,1);writeStore(NOTES+'_'+username,panels);writeStore(NOTES+'_'+username+'_active',Math.min(i,panels.length-1));render()}

function clearNote(){if(!confirm('Tyhjennetäänkö muistivihko?'))return;writeStore(NOTES+'_'+username,'');render()}
/* Teacher tools and quiz */
function tools(m){m.innerHTML=`<h2>🛠️ Opettajan työkalut</h2><div class="card"><h3>📝 Luo koe tai tietovisa</h3><input id="quizTitle" placeholder="Kokeen nimi"><textarea id="quizDesc" placeholder="Ohjeet oppilaille"></textarea>${audienceControl('quizAudience')}<p>Kirjoita kysymykset muodossa Kysymys|Vastaus, yksi per rivi.</p><textarea id="quizQuestions" placeholder="Paljonko 12 × 12?|144&#10;Paljonko 100 ÷ 4?|25"></textarea><button onclick="addQuiz()">Julkaise koe</button></div><div class="card"><h3>📄 Tehtäväpaperin luonti</h3><button onclick="go('worksheets')">Avaa tehtäväpaperit</button></div><div class="card"><h3>📢 Ilmoitukset</h3><button onclick="go('news')">Luo ilmoitus</button></div><div class="card"><h3>📒 Muistiinpanot</h3><button onclick="go('notes')">Avaa muistivihko</button></div>`}
function addQuiz(){let title=$('quizTitle').value.trim(),desc=$('quizDesc').value.trim(),raw=$('quizQuestions').value.trim();if(!title||!raw)return alert('Täytä nimi ja kysymykset.');let questions=raw.split(/\r?\n/).map(x=>x.split('|')).filter(x=>x.length>=2&&x[0].trim()&&x.slice(1).join('|').trim()).map(x=>({q:x[0].trim(),a:x.slice(1).join('|').trim()}));if(!questions.length)return alert('Tarkista kysymysten muoto.');let d=getData();d.quizzes.push({title,desc,author:username,audience:$('quizAudience').value,questions});save(d);go('quizzes')}
function quizzes(m){let d=getData(),qs=d.quizzes.filter(visible);m.innerHTML=`<h2>📝 Kokeet ja tietovisat</h2>${role!=='student'?`<button onclick="go('tools')">Luo uusi koe</button>`:''}${qs.map(q=>{let i=d.quizzes.indexOf(q);return `<div class="card"><h3>${esc(q.title)}</h3><p>${esc(q.desc)}</p><small>Opettaja: ${esc(q.author)} · ${q.audience==='ALL'?'Kaikki luokat':esc(q.audience)}</small>${q.questions.map((x,j)=>`<div class="item"><b>${j+1}. ${esc(x.q)}</b><input id="quiz${i}_${j}" placeholder="Vastaus"></div>`).join('')}<button onclick="checkQuiz(${i})">Tarkista vastaukset</button><p id="quizScore${i}"></p>${role==='admin'?`<button onclick="deleteQuiz(${i})">Poista koe</button>`:''}</div>`}).join('')||`<div class="card">Ei kokeita tälle luokalle.</div>`}`}
function checkQuiz(i){let d=getData(),q=d.quizzes[i],score=0;q.questions.forEach((x,j)=>{let el=$(`quiz${i}_${j}`);let ok=el.value.trim().toLowerCase()===x.a.toLowerCase();if(ok)score++;el.style.borderColor=ok?'green':'red'});$(`quizScore${i}`).textContent=`Tulos: ${score}/${q.questions.length}`}
function deleteQuiz(i){let d=getData();d.quizzes.splice(i,1);save(d);render()}

/* Worksheet topic templates: created tasks remain fully editable. */
function generateWorksheetPreset(){if(!can('createWorksheets'))return;let sel=$('wsPreset');if(!sel||!sel.value)return alert('Valitse tehtäväpohja.');let templates={
 fractions:[['Murtoluvut: sievennä','Sievennä murtoluvut: 6/12, 8/20, 15/25.'],['Murtolukujen yhteenlasku','Laske: 1/4 + 2/4 ja 2/3 + 1/6.'],['Murtolukujen vähennys','Laske: 5/6 − 1/3 ja 7/8 − 3/8.'],['Murtoluku sekalukuna','Muuta 11/4 ja 17/5 sekaluvuiksi.']],

/* Classroom Screen: timer, stopwatch, editable poll, fullscreen. */
let classroomInterval=null, classroomSeconds=0, stopwatchInterval=null, stopwatchSeconds=0;
function classroom(m){m.innerHTML=`<h2>🖥️ Classroom Screen</h2><div class="grid"><div class="card"><h3>⏳ Ajastin</h3><input id="timerMinutes" type="number" min="1" max="180" value="5" placeholder="Minuutit"><div class="big" id="timerDisplay">05:00</div><button onclick="startClassTimer()">Käynnistä</button><button onclick="pauseClassTimer()">Pysäytä</button><button onclick="resetClassTimer()">Nollaa</button></div><div class="card"><h3>⏱️ Sekuntikello</h3><div class="big" id="stopwatchDisplay">00:00</div><button onclick="startStopwatch()">Käynnistä</button><button onclick="pauseStopwatch()">Pysäytä</button><button onclick="resetStopwatch()">Nollaa</button></div><div class="card"><h3>🎲 Satunnainen oppilas</h3><input id="studentNames" placeholder="Nimet pilkuilla eroteltuna"><button onclick="pickStudent()">Arvo nimi</button><div class="big" id="pickedStudent"></div></div><div class="card"><h3>📊 Pikakysely</h3><input id="pollQuestion" placeholder="Kysymys"><input id="pollChoices" placeholder="Vaihtoehdot pilkuilla, esim. A,B,C"><button onclick="showPoll()">Näytä kysely</button><div id="pollArea"></div></div></div><button onclick="classroomFullscreen()">⛶ Koko näyttö</button>`}
function fmtClock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startClassTimer(){if(classroomInterval)return;classroomSeconds=Math.max(1,parseInt($('timerMinutes').value)||5)*60;$('timerDisplay').textContent=fmtClock(classroomSeconds);classroomInterval=setInterval(()=>{if(!document.getElementById('timerDisplay')){pauseClassTimer();return}if(classroomSeconds>0){classroomSeconds--;$('timerDisplay').textContent=fmtClock(classroomSeconds)}else{pauseClassTimer();alert('Ajastin päättyi!')}},1000)}
function pauseClassTimer(){if(classroomInterval){clearInterval(classroomInterval);classroomInterval=null}}
function resetClassTimer(){pauseClassTimer();classroomSeconds=Math.max(1,parseInt($('timerMinutes')?.value)||5)*60;if($('timerDisplay'))$('timerDisplay').textContent=fmtClock(classroomSeconds)}
function startStopwatch(){if(stopwatchInterval)return;stopwatchInterval=setInterval(()=>{stopwatchSeconds++;if($('stopwatchDisplay'))$('stopwatchDisplay').textContent=fmtClock(stopwatchSeconds)},1000)}
function pauseStopwatch(){clearInterval(stopwatchInterval);stopwatchInterval=null}
function resetStopwatch(){pauseStopwatch();stopwatchSeconds=0;if($('stopwatchDisplay'))$('stopwatchDisplay').textContent='00:00'}
function pickStudent(){let names=($('studentNames').value||'').split(',').map(n=>n.trim()).filter(Boolean);$('pickedStudent').textContent=names.length?names[Math.floor(Math.random()*names.length)]:'Lisää ensin oppilaiden nimet.'}

function worksheets(m){let d=getData(),ws=d.worksheets.filter(visible);m.innerHTML=`<h2>📄 Tehtäväpaperit</h2>${role!=='student'?`<div class="card"><h3>✨ Luo oma tehtäväpaperi</h3><label>Tehtäväpaperin otsikko</label><input id="wsTitle" placeholder="Esim. Kahdeksannen luokan matematiikka"><label>Logo / koulun nimi</label><input id="wsLogo" placeholder="Esim. OPPIMISKESKUS"><label>Aine</label><select id="wsSubject">${subjectOptions()}</select><label>Aihe</label><input id="wsTopic" placeholder="Esim. Prosenttilaskut"><label>Luokka</label><select id="wsAudience">${gradeOptions('ALL')}</select><label>Ohjeet</label><textarea id="wsInstructions" placeholder="Lue tehtävät huolellisesti..."></textarea><label>Valmiit tehtäväpohjat</label><select id="wsPreset"><option value="">Valitse pohja...</option><option value="fractions">Murtoluvut</option><option value="algebra">Algebra / yhtälöt</option><option value="basic">Peruslaskut</option><option value="percent">Prosentit</option><option value="geometry">Geometria</option></select><button onclick="generateWorksheetPreset()">Luo tehtävät valitusta aiheesta</button><hr><h3>➕ Tehtävät ja osiot</h3><div id="blocks"></div><button onclick="addBlock()">＋ Lisää kysymys / osio</button><hr><label>Lisää lopputeksti</label><textarea id="wsEnd" placeholder="Onnea tehtäviin!"></textarea><div class="item"><b>Esikatselu</b><button onclick="previewWorksheet()">👁️ Esikatsele</button></div><button onclick="publishWorksheet()">💾 Tallenna ja julkaise</button></div>`:''}<div id="preview"></div><h3>📚 Julkaistut tehtäväpaperit</h3>${ws.slice().reverse().map(w=>{let i=d.worksheets.indexOf(w);return `<div class="card"><h3>${esc(w.title)}</h3><p>${esc(w.subject)} · ${esc(w.topic)} · ${esc(w.audience==='ALL'?'Kaikki luokat':w.audience)}</p><p>Tekijä: ${esc(w.author)}</p><button onclick="downloadWorksheet(${i})">⬇️ Lataa</button><button onclick="copyWorksheet(${i})">📋 Kopioi</button><button onclick="showWorksheet(${i})">👁️ Näytä</button>${role==='admin'?`<button onclick="deleteWorksheet(${i})">Poista</button>`:''}</div>`}).join('')||`<div class="card">Ei julkaistuja tehtäväpapereita.</div>`}`;if(role!=='student'){blocks=[];addBlock()}}
function addBlock(){blocks.push({type:'question',title:'',text:''});drawBlocks()}
function drawBlocks(){let el=$('blocks');if(!el)return;el.innerHTML=blocks.map((b,i)=>`<div class="item"><label>Osio ${i+1}</label><select onchange="blocks[${i}].type=this.value"><option value="question" ${b.type==='question'?'selected':''}>Kysymys</option><option value="heading" ${b.type==='heading'?'selected':''}>Otsikko</option><option value="text" ${b.type==='text'?'selected':''}>Tekstiosio</option><option value="calculation" ${b.type==='calculation'?'selected':''}>Laskutehtävä</option></select><input placeholder="Otsikko" value="${esc(b.title)}" oninput="blocks[${i}].title=this.value"><textarea placeholder="Tehtävä tai sisältö" oninput="blocks[${i}].text=this.value">${esc(b.text)}</textarea><button onclick="blocks.splice(${i},1);drawBlocks()">Poista osio</button></div>`).join('')}
function worksheetObject(){return {title:$('wsTitle').value.trim(),logo:$('wsLogo').value.trim(),subject:$('wsSubject').value,topic:$('wsTopic').value.trim(),audience:$('wsAudience').value,instructions:$('wsInstructions').value.trim(),end:$('wsEnd').value.trim(),blocks:blocks.map(b=>({...b})),author:username,grade:myGrade,date:new Date().toLocaleDateString('fi-FI')}}
function worksheetHTML(w){return `<!DOCTYPE html><html lang="fi"><head><meta charset="UTF-8"><title>${esc(w.title)}</title><style>body{font-family:Arial;max-width:800px;margin:40px auto;padding:20px;color:#222}h1{border-bottom:2px solid #555;padding-bottom:12px}.task{border:1px solid #ddd;padding:16px;margin:15px 0;border-radius:8px}.line{border-bottom:1px solid #aaa;height:35px}@media print{button{display:none}}</style></head><body><header><h2>${esc(w.logo)}</h2></header><h1>${esc(w.title)}</h1><p>${esc(w.subject)} · ${esc(w.topic)} · ${esc(w.audience==='ALL'?'Kaikki luokat':w.audience)}</p><p>Nimi: __________________________ Päivämäärä: ______________</p><p>${esc(w.instructions)}</p>${w.blocks.map((b,i)=>`<div class="task">${b.type==='heading'?`<h2>${esc(b.title)}</h2>`:`<h3>${i+1}. ${esc(b.title||'Tehtävä')}</h3>`}<p>${esc(b.text)}</p>${b.type==='question'||b.type==='calculation'?`<div class="line"></div><div class="line"></div>`:''}</div>`).join('')}<p>${esc(w.end)}</p><button onclick="window.print()">Tulosta tehtäväpaperi</button></body></html>`}
function previewWorksheet(){let w=worksheetObject();if(!w.title)return alert('Anna tehtäväpaperille otsikko.');$('preview').innerHTML=`<div class="card"><h3>Esikatselu</h3><p>${esc(w.title)} · ${esc(w.subject)} · ${esc(w.topic)}</p><p>${esc(w.instructions)}</p>${w.blocks.map(b=>`<div class="item"><b>${esc(b.title)}</b><p>${esc(b.text)}</p></div>`).join('')}</div>`}
function publishWorksheet(){let w=worksheetObject();if(!w.title)return alert('Kirjoita otsikko.');if(!w.blocks.length)return alert('Lisää vähintään yksi osio.');if(!w.blocks.some(b=>b.text.trim()||b.title.trim()))return alert('Lisää tehtävän sisältö.');let d=getData();d.worksheets.push(w);save(d);alert('Tehtäväpaperi julkaistu!');render()}
function downloadWorksheet(i){let w=getData().worksheets[i],blob=new Blob([worksheetHTML(w)],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tehtavapaperi.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function copyWorksheet(i){let w=getData().worksheets[i],txt=`${w.title}\n${w.subject}\n${w.topic}\n${w.instructions}\n`+w.blocks.map(b=>b.title+'\n'+b.text).join('\n\n');navigator.clipboard.writeText(txt).then(()=>alert('Tehtäväpaperin teksti kopioitu!')).catch(()=>alert('Kopiointi ei onnistunut selaimessa.'))}

/* Math game: explicit DOM references, integer arithmetic, and answer validation */
function games(m){m.innerHTML=`<h2>🎮 Matematiikkapelit</h2><div class="card"><h3>Vaikeustaso</h3><select id="difficultySelect"><option value="easy">🟢 Helppo</option><option value="medium" selected>🟡 Keskitaso</option><option value="hard">🔴 Vaikea</option><option value="extreme">🔥 Todella vaikea</option></select><h3>Laskutyyppi</h3><select id="operationSelect"><option value="mix">Kaikki</option><option value="add">➕ Yhteenlasku</option><option value="sub">➖ Vähennyslasku</option><option value="mul">✖️ Kertolasku</option><option value="div">➗ Jakolasku</option><option value="fraction">Murtoluvut</option><option value="percent">Prosentit</option><option value="power">Potenssit</option><option value="root">Neliöjuuret</option></select><button onclick="startGame()">Aloita peli</button></div><div class="card" id="gameArea">Valitse peli!</div><div class="card">🏆 Oikein: <b id="score">0 / 0</b></div>`}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function startGame(){gameType=$('operationSelect').value;difficulty=$('difficultySelect').value;points=0;answered=0;$('score').textContent='0 / 0';question()}
function question(){let range={easy:15,medium:60,hard:300,extreme:1000}[difficulty];let type=gameType;if(type==='mix')type=['add','sub','mul','div','fraction','percent','power','root'][rnd(0,7)];let a=rnd(2,range),b=rnd(2,range),display='',answer;
if(type==='add'){answer=a+b;display=`${a} + ${b}`}
if(type==='sub'){if(b>a)[a,b]=[b,a];answer=a-b;display=`${a} − ${b}`}
if(type==='mul'){a=rnd(2,difficulty==='extreme'?100:30);b=rnd(2,30);answer=a*b;display=`${a} × ${b}`}
if(type==='div'){b=rnd(2,20);answer=rnd(2,40);a=b*answer;display=`${a} ÷ ${b}`}
if(type==='fraction'){let den=rnd(2,10),num=rnd(1,den-1),mult=rnd(2,5);answer=`${num}/${den}`;display=`Sievennä: ${num*mult}/${den*mult}`}
if(type==='percent'){let p=[10,15,20,25,30,40,50,75][rnd(0,7)];a=rnd(2,20)*10;answer=a*p/100;display=`${p}% luvusta ${a}`}
if(type==='power'){a=rnd(2,15);b=rnd(2,4);answer=a**b;display=`${a}^${b}`}
if(type==='root'){a=rnd(2,30);answer=a;display=`√${a*a}`}
currentQuestion={answer,type};$('gameArea').innerHTML=`<h3>🧠 Ratkaise!</h3><div class="big">${display} = ?</div><input id="gameAnswerInput" placeholder="Vastauksesi" autocomplete="off"><button onclick="checkGame()">Tarkista</button><p id="feedback"></p><button onclick="question()">Seuraava lasku</button>`;$('gameAnswerInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkGame()})}
function checkGame(){let input=$('gameAnswerInput');if(!input)return;let v=input.value.trim().replace(/\s/g,'');if(!v)return;let target=String(currentQuestion.answer);let ok=v.replace(',','.').toLowerCase()===target.toLowerCase();answered++;if(ok)points++;let fb=$('feedback');fb.textContent=ok?'🎉 Oikein!':'❌ Väärin. Oikea vastaus: '+target;fb.className=ok?'good':'bad';$('score').textContent=points+' / '+answered;input.disabled=true}
/* Admin dashboard */
function adminPage(m){let a=accounts(),rolesList=readStore(ROLES,['Admin','Opettaja','Oppilas','Moderaattori']),perm=getPerms();m.innerHTML=`<h2>🛡️ Admin-hallinta</h2><div class="card"><h3>⛔ Estä käyttäjä</h3><input id="banName" placeholder="Käyttäjätunnus"><button onclick="banUser()">Estä tällä laitteella</button><p class="muted">Paikallinen esto: tämä toimii vain tämän selaimen tallennuksessa. Todellinen kaikkien käyttäjien esto vaatii palvelimen.</p><h4>Estolistalla</h4>${banned().map(b=>`<div class="item">${esc(b)} <button onclick="unbanUser('${esc(b)}')">Poista esto</button></div>`).join('')||'Ei estettyjä käyttäjiä.'}</div><div class="card"><h3>👤 Käyttäjätilit (tämän laitteen tallennus)</h3>${a.map(u=>`<div class="item"><b>${esc(u.name)}</b> · ${esc(u.role)} · ${esc(u.grade)}<button onclick="deleteAccount('${esc(u.name)}','${esc(u.role)}')">Poista tili</button></div>`).join('')||'Ei rekisteröityjä tilejä.'}</div><div class="card"><h3>🎭 Roolit</h3><p>Lisää paikallinen roolinimi (roolinimet eivät automaattisesti anna oikeuksia).</p><input id="newRole" placeholder="Uuden roolin nimi"><button onclick="addRole()">Lisää rooli</button><ul>${rolesList.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div><div class="card"><h3>🔐 Oikeudet</h3><p>Oikeuksien valinnat ovat tämän selaimen asetuksia.</p>${Object.keys(DEFAULT_PERMS).map(k=>`<label><input type="checkbox" style="width:auto" id="perm_${k}" ${perm[k]?'checked':''}> ${esc(permissionLabel(k))}</label><br>`).join('')}<button onclick="savePermissions()">Tallenna oikeudet</button></div><div class="card"><h3>🧹 Nollaa sisältö</h3><p>Poistaa ilmoitukset, päivitykset, kokeet, tehtäväpaperit ja merkinnät.</p><button onclick="resetContent()">Nollaa kaikki sivujen sisällöt</button></div>`}
function permissionLabel(k){return ({adminUpdates:'Admin saa julkaista päivityksiä',manageAccounts:'Hallinnoi käyttäjiä / estolistaa',resetContent:'Nollaa sisältö',manageRoles:'Lisää roolinimiä',teacherNotes:'Opettajan muistivihko',createQuizzes:'Luo kokeita',createWorksheets:'Luo tehtäväpapereita',postAnnouncements:'Julkaise ilmoituksia'})[k]||k}
function banUser(){let n=$('banName').value.trim();if(!n)return alert('Kirjoita käyttäjätunnus.');let b=banned();if(!b.some(x=>x.toLowerCase()===n.toLowerCase()))b.push(n);writeStore(BANS,b);render()}
function unbanUser(n){writeStore(BANS,banned().filter(x=>x.toLowerCase()!==n.toLowerCase()));render()}
function deleteAccount(n,r){if(!confirm(`Poistetaanko ${n} (${r}) tili tästä selaimesta?`))return;saveAccounts(accounts().filter(x=>!(x.name.toLowerCase()===n.toLowerCase()&&x.role===r)));render()}
function addRole(){if(!can('manageRoles'))return;let n=$('newRole').value.trim();if(!n)return;let r=readStore(ROLES,['Admin','Opettaja','Oppilas','Moderaattori']);if(!r.includes(n))r.push(n);writeStore(ROLES,r);render()}
function savePermissions(){let p={};Object.keys(DEFAULT_PERMS).forEach(k=>p[k]=$(`perm_${k}`).checked);writeStore(PERMS,p);alert('Oikeudet tallennettu.');render()}
function resetContent(){if(!can('resetContent')||!confirm('Nollataanko kaikki sivujen sisällöt? Tätä ei voi perua.'))return;save(fresh());render();alert('Sisällöt nollattu.')}
/* Discipline/teacher records */
function discipline(m){if(role==='student')return;let d=getData();m.innerHTML=`<h2>📋 Opettajan merkinnät</h2><div class="card"><label>Oppilaan nimi</label><input id="punishName"><label>Merkinnän kuvaus</label><textarea id="punishReason"></textarea><label>Toimenpide</label><select id="punishType"><option>Jälki-istunto</option><option>Opettajan keskustelu</option><option>Yhteydenotto kotiin</option><option>Muu koulun käytäntö</option></select><button onclick="addPunishment()">Tallenna</button></div>${d.punishments.map((p,i)=>`<div class="card"><b>${esc(p.name)}</b><p>${esc(p.type)} · ${esc(p.reason)}</p><small>${esc(p.teacher)} · ${esc(p.date)}</small><button onclick="deletePunishment(${i})">Poista</button></div>`).join('')}`}

/* OppimisKeskus 3.3 upgrades: role credentials, per-role permissions, page builder,
   responsive ban/update refresh, language toggle. Local-browser storage only. */
const ROLECFG='oppimiskeskus_role_config_33',LANGKEY='oppimiskeskus_lang_33';
function roleCfg(){return readStore(ROLECFG,{});}
function rolePermission(roleName,key){if(roleName==='admin')return true;if(roleName==='student')return ['viewNews','viewUpdates','viewQuizzes','mathGame'].includes(key);if(roleName==='teacher')return ['viewNews','viewUpdates','viewQuizzes','mathGame','classroom','worksheets','teacherNotes','postAnnouncements','createQuizzes','createWorksheets','marks'].includes(key);let cfg=roleCfg()[roleName];return !!(cfg&&cfg.permissions&&cfg.permissions[key]);}
// Explicit built-in role permissions
function hasAccess(key){if(role==='admin')return true;if(role==='student')return ['viewNews','viewUpdates','viewQuizzes','mathGame','myMarks'].includes(key);if(role==='teacher')return ['viewNews','viewUpdates','viewQuizzes','mathGame','classroom','worksheets','teacherNotes','postAnnouncements','createQuizzes','createWorksheets','marks'].includes(key);return !!rolePermission(role,key)}
function customRoleList(){return Object.keys(roleCfg());}
function populateRoleChoices(){let sel=$('role');if(!sel)return;let chosen=sel.value;sel.innerHTML='<option value="student">Oppilas</option><option value="teacher">Opettaja</option><option value="admin">Admin</option>'+customRoleList().map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');if([...sel.options].some(o=>o.value===chosen))sel.value=chosen;}
function login(){const r=$('role').value,n=$('name').value.trim(),p=$('password').value,g=$('grade').value;if(!n){$('error').textContent='Kirjoita käyttäjätunnus.';return}if(!g){$('error').textContent='Valitse luokka.';return}if(isBanned(n)){$('error').textContent='Tämä käyttäjä on estetty.';return}let list=accounts(),existing=list.find(a=>a.name.toLowerCase()===n.toLowerCase());if(r==='admin'){if(p!==ADMIN_PASS){$('error').textContent='Väärä admin-salasana.';return}role='admin';username=n;myGrade=g}else if(existing){if(existing.role!==r){$('error').textContent='Tällä nimellä on jo tili eri roolissa.';return}if(existing.password!==p){$('error').textContent='Väärä salasana.';return}role=existing.role;username=existing.name;myGrade=existing.grade||g}else{let isCustom=customRoleList().includes(r);if(!isCustom&&((r==='student'&&p!==STUDENT_PASS&&p.length<4)||(r==='teacher'&&p!==TEACHER_PASS&&p.length<4))){$('error').textContent='Salasanan tulee olla vähintään 4 merkkiä.';return}if(isCustom&&p!==roleCfg()[r].password){$('error').textContent='Väärä roolin salasana.';return}list.push({name:n,role:r,grade:g,password:p,created:new Date().toISOString()});saveAccounts(list);role=r;username=n;myGrade=g}page='home';$('login').classList.add('hidden');$('site').classList.remove('hidden');render();}
function renderCore33(){populateRoleChoices();let pageItems=[['home','🏠 Etusivu'],['news','📢 Ilmoitukset'],['updates','🆕 Päivitykset']];if(hasAccess('viewQuizzes'))pageItems.push(['quizzes','📝 Kokeet']);if(hasAccess('mathGame'))pageItems.push(['games','🎮 Matematiikka']);if(hasAccess('worksheets'))pageItems.push(['worksheets','📄 Tehtäväpaperit']);if(hasAccess('classroom'))pageItems.push(['classroom','🖥️ Classroom Screen']);if(role==='student')pageItems.push(['myMarks','🔔 Omat merkinnät']);pageItems.push(...readStore('oppimiskeskus_pages_33',[]).map((x,i)=>['customPage'+i,'📌 '+x.title]));$('nav').innerHTML=pageItems.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')+(hasAccess('createQuizzes')?'<button onclick="go(\'tools\')">🛠️ Opettaja</button>':'')+(hasAccess('teacherNotes')?'<button onclick="go(\'notes\')">📒 Muistiinpanot</button>':'')+(role==='admin'?'<button onclick="go(\'admin\')">🛡️ Admin</button>':'')+(hasAccess('marks')?'<button onclick="go(\'discipline\')">📋 Merkinnät</button>':'')+'<button onclick="logout()">🚪 Ulos</button>';let m=$('main');if(page==='home')home(m);if(page==='news')news(m);if(page==='updates')updates(m);if(page==='quizzes'&&hasAccess('viewQuizzes'))quizzes(m);if(page==='games'&&hasAccess('mathGame'))games(m);if(page==='worksheets'&&hasAccess('worksheets'))worksheets(m);if(page==='tools'&&hasAccess('createQuizzes'))tools(m);if(page==='notes'&&hasAccess('teacherNotes'))notes(m);if(page==='admin'&&role==='admin')adminPage(m);if(page==='discipline'&&hasAccess('marks'))discipline(m);if(page==='classroom'&&hasAccess('classroom'))classroom(m);if(page==='myMarks'&&role==='student')myMarks(m);if(page.startsWith('customPage')){let idx=Number(page.slice(10)),pg=readStore('oppimiskeskus_pages_33',[])[idx];if(pg)m.innerHTML=`<section class="card"><h2>${esc(pg.title)}</h2>${(pg.blocks||[]).map(b=>b.type==='image'?`<img src="${esc(b.content)}" style="max-width:100%;border-radius:12px">`:b.type==='button'?`<button onclick="${b.action==='url'?`window.open('${esc(b.target)}','_blank')`:`alert('${esc(b.target)}')`}">${esc(b.content)}</button>`:`<div class="card"><p>${esc(b.content).replace(/\n/g,'<br>')}</p></div>`).join('')}</section>`}}
function adminPage(m){let roleNames=customRoleList(),cfg=roleCfg(),allPerms=['viewNews','viewUpdates','viewQuizzes','mathGame','classroom','worksheets','teacherNotes','createQuizzes','createWorksheets','postAnnouncements','marks'];let labels={viewNews:'Ilmoitukset',viewUpdates:'Päivitykset',viewQuizzes:'Kokeet',mathGame:'Matematiikkapeli',classroom:'Classroom Screen',worksheets:'Tehtäväpaperit',teacherNotes:'Muistiinpanot',createQuizzes:'Kokeiden luonti',createWorksheets:'Tehtäväpaperien luonti',postAnnouncements:'Ilmoitusten julkaisu',marks:'Merkinnät'};m.innerHTML=`<h2>🛡️ Admin-hallinta · 3.3</h2><div class="card"><h3>⛔ Ban / unban (välitön)</h3><input id="banName" placeholder="Käyttäjän nimi"><button onclick="banUser()">Estä käyttäjä</button><p>Estot päivittyvät tässä selaimessa heti ja myös muissa saman selaimen välilehdissä.</p>${banned().map(n=>`<div class="item">${esc(n)} <button onclick="unbanUser('${esc(n)}')">Poista esto</button></div>`).join('')}</div><div class="card"><h3>🎭 Roolin luonti</h3><input id="newRole" placeholder="Roolin nimi"><input id="newRolePassword" type="password" placeholder="Roolin yhteinen salasana (min. 4 merkkiä)"><button onclick="createRole33()">Luo rooli</button><p class="muted">Uusi rooli tulee kirjautumisvalikkoon. Tilit luodaan roolin salasanalla.</p>${roleNames.map(n=>`<div class="item"><b>${esc(n)}</b><button onclick="editRole33('${esc(n)}')">Aseta oikeudet</button><button onclick="removeRole33('${esc(n)}')">Poista rooli</button></div>`).join('')}</div><div class="card"><h3>🧩 Roolin oikeudet</h3><select id="roleEditSelect" onchange="editRole33(this.value)"><option value="">Valitse rooli</option>${roleNames.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div id="rolePermEditor"></div></div><div class="card"><h3>🌐 Julkaise oma sivu ilman koodausta</h3><input id="pageTitle33" placeholder="Sivun nimi"><select id="pageBlockType"><option value="text">Tekstiosio</option><option value="image">Kuva URL-osoitteella</option><option value="button">Painike</option></select><textarea id="pageBlockContent" placeholder="Teksti, kuvan URL tai painikkeen nimi"></textarea><select id="pageButtonAction"><option value="alert">Painike näyttää viestin</option><option value="url">Painike avaa linkin</option></select><input id="pageButtonTarget" placeholder="Linkki tai painikkeen viesti"><button onclick="addAdminPageBlock33()">Lisää osio sivulle</button><div id="pageBuilderPreview33"></div><button onclick="publishAdminPage33()">Julkaise sivu kaikille</button><h4>Julkaistut sivut</h4>${readStore('oppimiskeskus_pages_33',[]).map((x,i)=>`<div class="item">${esc(x.title)} <button onclick="deleteAdminPage33(${i})">Poista</button></div>`).join('')}</div><div class="card"><h3>🆕 Päivitykset</h3><p>Admin voi julkaista päivityksiä Päivitykset-välilehdellä.</p><button onclick="go('updates')">Avaa päivitykset</button></div><div class="card"><h3>🧹 Resetoi</h3><button onclick="resetContent()">Resetoi sisältö</button></div>`;window._pageBlocks33=[];}
function createRole33(){let n=$('newRole').value.trim(),p=$('newRolePassword').value;if(!n||p.length<4)return alert('Nimi ja vähintään 4 merkin salasana vaaditaan.');if(['admin','teacher','student','oppilas','opettaja'].includes(n.toLowerCase()))return alert('Tämä roolinimi on varattu.');let c=roleCfg();if(c[n])return alert('Rooli on jo olemassa.');c[n]={password:p,permissions:{}};writeStore(ROLECFG,c);let list=readStore(ROLES,['Admin','Opettaja','Oppilas','Moderaattori']);if(!list.includes(n))list.push(n);writeStore(ROLES,list);render();}
function editRole33(n){if(!n||!roleCfg()[n])return;let c=roleCfg()[n],keys=['viewNews','viewUpdates','viewQuizzes','mathGame','classroom','worksheets','teacherNotes','createQuizzes','createWorksheets','postAnnouncements','marks'],names=['Ilmoitukset','Päivitykset','Kokeet','Matematiikka','Classroom Screen','Tehtäväpaperit','Muistiinpanot','Luo kokeita','Luo tehtäväpapereita','Julkaise ilmoituksia','Merkinnät'];$('roleEditSelect').value=n;$('rolePermEditor').innerHTML=`<h4>${esc(n)} · oikeudet</h4>${keys.map((k,i)=>`<label><input type="checkbox" style="width:auto" id="r33_${k}" ${c.permissions[k]?'checked':''}> ${names[i]}</label><br>`).join('')}<button onclick="saveRolePerms33('${esc(n)}')">Tallenna roolin oikeudet</button>`;}
function saveRolePerms33(n){let c=roleCfg();if(!c[n])return;['viewNews','viewUpdates','viewQuizzes','mathGame','classroom','worksheets','teacherNotes','createQuizzes','createWorksheets','postAnnouncements','marks'].forEach(k=>c[n].permissions[k]=$('r33_'+k).checked);writeStore(ROLECFG,c);alert('Roolin oikeudet tallennettu.');render();}
function removeRole33(n){if(!confirm('Poistetaanko rooli?'))return;let c=roleCfg();delete c[n];writeStore(ROLECFG,c);writeStore(ROLES,readStore(ROLES,[]).filter(x=>x!==n));render();}
function addAdminPageBlock33(){let type=$('pageBlockType').value,content=$('pageBlockContent').value.trim(),target=$('pageButtonTarget').value.trim();if(!content)return alert('Kirjoita osion sisältö.');window._pageBlocks33=window._pageBlocks33||[];window._pageBlocks33.push({type,content,target,action:$('pageButtonAction').value});$('pageBuilderPreview33').innerHTML=(window._pageBlocks33||[]).map(b=>`<div class="item">${esc(b.type)} · ${esc(b.content)}</div>`).join('');$('pageBlockContent').value='';}
function publishAdminPage33(){let title=$('pageTitle33').value.trim(),blocks=window._pageBlocks33||[];if(!title||!blocks.length)return alert('Lisää sivun nimi ja vähintään yksi osio.');let arr=readStore('oppimiskeskus_pages_33',[]);arr.push({title,blocks,author:username,date:new Date().toISOString()});writeStore('oppimiskeskus_pages_33',arr);alert('Sivu julkaistu tässä selaimessa.');render();}
function deleteAdminPage33(i){let arr=readStore('oppimiskeskus_pages_33',[]);arr.splice(i,1);writeStore('oppimiskeskus_pages_33',arr);render();}
function banUser(){let n=$('banName').value.trim();if(!n)return alert('Kirjoita käyttäjätunnus.');let b=banned();if(!b.some(x=>x.toLowerCase()===n.toLowerCase()))b.push(n);writeStore(BANS,b);window.dispatchEvent(new Event('storage'));render();}
function unbanUser(n){writeStore(BANS,banned().filter(x=>x.toLowerCase()!==n.toLowerCase()));render();}
